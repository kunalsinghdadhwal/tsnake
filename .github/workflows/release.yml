name: Release

on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: write

jobs:
    build:
        name: Build ${{ matrix.target }}
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      artifact_name: tsnake
                      asset_name: tsnake-linux-x86_64
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      artifact_name: tsnake.exe
                      asset_name: tsnake-windows-x86_64.exe

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Build release binary
              run: cargo build --release --target ${{ matrix.target }}

            - name: Strip binary (Linux)
              if: matrix.os == 'ubuntu-latest'
              run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

            - name: Prepare binary (Linux)
              if: matrix.os == 'ubuntu-latest'
              run: |
                  cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}
                  chmod +x ${{ matrix.asset_name }}

            - name: Prepare binary (Windows)
              if: matrix.os == 'windows-latest'
              shell: pwsh
              run: |
                  Copy-Item -Path target/${{ matrix.target }}/release/${{ matrix.artifact_name }} -Destination ${{ matrix.asset_name }}

            - name: Generate SHA256 checksum (Linux)
              if: matrix.os == 'ubuntu-latest'
              run: |
                  sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256

            - name: Generate SHA256 checksum (Windows)
              if: matrix.os == 'windows-latest'
              shell: pwsh
              run: |
                  $hash = (Get-FileHash -Algorithm SHA256 ${{ matrix.asset_name }}).Hash
                  "$hash  ${{ matrix.asset_name }}" | Out-File -FilePath ${{ matrix.asset_name }}.sha256 -Encoding ASCII

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.asset_name }}
                  path: |
                      ${{ matrix.asset_name }}
                      ${{ matrix.asset_name }}.sha256

    release:
        name: Create Release
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts

            - name: Display structure of downloaded files
              run: ls -R artifacts

            - name: Move artifacts to root
              run: |
                  mkdir -p release-assets
                  find artifacts -type f -exec mv {} release-assets/ \;

            - name: Create Release
              uses: softprops/action-gh-release@v1
              with:
                  files: release-assets/*
                  body: |
                      ## TSNAKE Release ${{ github.ref_name }}

                      A beautiful terminal Snake game written in Rust with modern 2025 aesthetics.

                      ### Downloads

                      Download the binary for your platform and run immediately:

                      **Linux (x86_64)**
                      - Binary: `tsnake-linux-x86_64`
                      - SHA256: `tsnake-linux-x86_64.sha256`

                      **Windows (x86_64)**
                      - Binary: `tsnake-windows-x86_64.exe`
                      - SHA256: `tsnake-windows-x86_64.exe.sha256`

                      ### Quick Start

                      **Linux:**
                      ```bash
                      # Download and run
                      chmod +x tsnake-linux-x86_64
                      ./tsnake-linux-x86_64

                      # Or install globally
                      sudo mv tsnake-linux-x86_64 /usr/local/bin/tsnake
                      ```

                      **Windows:**
                      Download `tsnake-windows-x86_64.exe`, rename to `tsnake.exe` if desired, and run directly.

                      Optionally add to your PATH for global access.

                      ### Verify SHA256

                      **Linux:**
                      ```bash
                      sha256sum -c tsnake-linux-x86_64.sha256
                      ```

                      **Windows (PowerShell):**
                      ```powershell
                      $expected = (Get-Content tsnake-windows-x86_64.exe.sha256).Split()[0]
                      $actual = (Get-FileHash tsnake-windows-x86_64.exe -Algorithm SHA256).Hash
                      $expected -eq $actual
                      ```

                      ### Features
                      - Beautiful neon colors and modern 2025 aesthetics
                      - Multiple control schemes (Arrow keys, WASD, HJKL)
                      - Progressive difficulty with speed increases
                      - Persistent high scores
                      - Wall collision detection
                      - Pause and replay functionality
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
