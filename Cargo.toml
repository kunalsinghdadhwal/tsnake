[package]
name = "tsnake"
version = "1.0.0"
edition = "2021"
authors = ["Kunal Singh Dadhwal <kunalsinghdadhwal@gmail.com>"]
description = "A beautiful terminal-based Snake game"
license = "MIT"
repository = "https://github.com/kunalsinghdadhwal/tsnake"
keywords = ["game", "snake", "terminal", "tui"]
categories = ["games", "command-line-utilities"]

[[bin]]
name = "tsnake"
path = "src/main.rs"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs-next = "2.0"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
